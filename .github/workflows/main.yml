name: tauri-ci

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            rpm2cpio \
            cpio \
            squashfs-tools

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install bun
        run: npm install -g bun

      - name: Install frontend dependencies
        run: bun i

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: bun add -D @tauri-apps/cli@latest

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        with:
          projectPath: .
          tauriScript: bun tauri
          args: ''

      - name: Repackage Linux packages (astrobox-creator-console)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash ./scripts/build-linux.sh --no-build deb rpm appimage

      - name: Build Arch Linux package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          docker run --rm -v "${{ github.workspace }}":/work -w /work archlinux:base-devel \
            bash -lc 'set -e
              pacman -Sy --noconfirm --needed curl
              chmod -R a+rwX /work/scripts/archpkg
              mkdir -p /work/dist/linux
              chmod a+rwX /work/dist /work/dist/linux
              useradd -m builder
              su builder -c "/work/scripts/archpkg/build.sh prebuilt"
              cp /work/scripts/archpkg/astrobox-creator-console-*.pkg.tar.zst /work/dist/linux/'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/astrobox-creator-console
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            dist/linux/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install bun
        run: npm install -g bun

      - name: Install frontend dependencies
        run: bun i

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: bun add -D @tauri-apps/cli@latest

      - name: Build Android app
        run: npx tauri android build --target aarch64
        env:
          ORG_GRADLE_JAVA_HOME: ${{ env.JAVA_HOME }}
          NODE_OPTIONS: "--max-old-space-size=6144"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
