[package]
name = "astrobox-creator-console"
version = "0.2.1"
description = "把复杂统统留在背后"
authors = ["AstroSightStudios"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
chrono = "0.4"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
tauri-plugin-deep-link = "2"
anyhow = "1"
chrono = "0.4"
flate2 = "1"
tar = "0.4"
os_info = "3"
regex = "1"
sys-locale = "0.3"
sysinfo = "0.33"

# Patch swift-rs (transitive build-dep of tauri, used for the iOS Swift bridge)
# to our fork, which fixes cross-compilation pulling in the macOS SDK during
# iOS builds (Xcode 27). See https://github.com/searchstars/swift-rs
[patch.crates-io]
swift-rs = { git = "https://github.com/searchstars/swift-rs" }
tao = { git = "https://github.com/Searchstars/tao", rev = "112081883beaa648194422d2fb40d16538812549" }
